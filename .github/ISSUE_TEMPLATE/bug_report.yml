name: Something isn't working
description: The map, the trip editor or an import does something wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. A screenshot or photo of the mirror helps.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: The module's part of config.js
      description: Remove your editorPin and any Google Sheet link first.
      render: javascript
  - type: textarea
    id: log
    attributes:
      label: MagicMirror's log
      description: Lines that mention MMM-WorldMapTravelCollector (with pm2, `pm2 logs MagicMirror --lines 100`).
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: This module's version (in package.json), MagicMirror's version, and `node --version`
      placeholder: 1.0.0, MagicMirror 2.38.0, Node 22.22.0
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Raspberry Pi 4, 1080×1920 portrait, touch screen
