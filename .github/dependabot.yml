# Once a month, one pull request with every library update (and, when there are any, one with the
# GitHub test-tool updates). GitHub can't put the two kinds in the same pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-libraries:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all-test-tools:
        patterns: ["*"]
