<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#1d3b53">
	<meta name="robots" content="noindex">
	<title>Trip editor</title>
	<link rel="icon" href="icon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="editor.css">
	<script src="editor.js" defer></script>
</head>
<body>
	<header class="top">
		<img src="icon.svg" alt="" class="logo" width="28" height="28">
		<h1 id="title">Trips</h1>
		<span id="summary" class="summary"></span>
	</header>

	<main id="main" aria-live="polite">
		<p class="loading">Loading your trips…</p>
	</main>

	<nav class="tabs" id="tabs" hidden>
		<button type="button" data-tab="trips" class="active"><span class="tab-icon" aria-hidden="true">☰</span>Trips</button>
		<button type="button" data-tab="add"><span class="tab-icon" aria-hidden="true">＋</span>Add</button>
		<button type="button" data-tab="import"><span class="tab-icon" aria-hidden="true">⇪</span>Import</button>
		<button type="button" data-tab="more"><span class="tab-icon" aria-hidden="true">⋯</span>More</button>
	</nav>

	<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
